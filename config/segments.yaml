# HMDA purchaser_type -> holder segment (PLAN.md §7.2 step 4).
# "Retained" means not sold in the origination year. The loan may have been sold later,
# so every segment is a proxy for the current holder.
#
# HMDA purchaser_type codes (2018+ filing instructions; confirm against the public LAR
# data dictionary in Phase 3):
#   0 not applicable (not sold)  1 Fannie Mae  2 Ginnie Mae  3 Freddie Mac  4 Farmer Mac
#   5 private securitizer  6 commercial bank / savings bank / savings association
#   71 credit union, mortgage company or finance company  72 life insurance company
#   8 affiliate institution  9 other type of purchaser
holder_segments:
  retained:
    label: Retained (not sold in origination year)
    purchaser_types: [0]
    overlaps: Call Report buckets
  gse:
    label: Sold to Fannie / Freddie
    purchaser_types: [1, 3]
    overlaps: Agency pools (v2)
  ginnie:
    label: Ginnie Mae
    purchaser_types: [2]
    overlaps: Agency pools (v2)
  private_securitization:
    label: Private securitization
    purchaser_types: [5]
    overlaps: Non-agency RMBS (out of scope)
  other:
    label: Sold to another institution / affiliate / other
    # 4 (Farmer Mac) is not in the PLAN.md §7.2 table. It is not an agency MBS pool,
    # so it goes to the unknown-holder segment rather than being dropped.
    purchaser_types: [4, 6, 71, 72, 8, 9]
    overlaps: Unknown holder
# Any purchaser_type not listed above maps here, and the QA report counts those rows.
unmapped_segment: unmapped

# Lender type, from the Philadelphia Fed HMDA Lender File's TYPE ("Institution Type (Filer,
# NIC)"): code -> label, grouped by the lender_type it maps to. dim_hmda_lender keeps the raw
# code next to the mapped value, and dim_institution_type lists this table. Each code appears
# once; a code not listed maps to unknown_lender_type.
#
# The Lender File replaced the CFPB Reporter Panel as the lender source (docs/verification.md,
# "Lender source"). The panel's agency and lender codes needed a chain of rules and the Call
# Report link to classify lenders; TYPE comes from the Fed's National Information Center.
#
# One override: a lender whose RSSD files a Call Report that year gets call_report_filer_type,
# since only banks and savings associations file Call Reports. In 2018-2025 this retypes 21
# lender-years, mostly small banks coded 30 (credit union) that file HMDA under their bank
# names, e.g. Oxford Bank & Trust (2021) and Savibank (2025).
call_report_filer_type: bank
lender_types:
  bank:
    10: commercial bank
    13: failed commercial bank, no successor
    14: US branch of a foreign bank
    20: savings bank, savings and loan, industrial or cooperative bank
    23: failed thrift, no successor
  bank_affiliate:
    11: commercial bank subsidiary
    12: subsidiary of a bank or financial holding company
    21: subsidiary of a savings bank or other noncommercial depository
    22: subsidiary of a thrift holding company
    41: independent mortgage bank affiliated with a depository
  credit_union:
    30: credit union
    31: credit union subsidiary
    32: credit union service organization
    33: failed credit union, no successor
  independent_mortgage_company:
    40: independent mortgage bank
unknown_lender_type: unknown
