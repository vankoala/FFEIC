# HMDA purchaser_type -> holder segment (PLAN.md §7.2 step 4).
# "Retained" means not sold in the origination year. The loan may have been sold later,
# so every segment is a proxy for the current holder.
#
# HMDA purchaser_type codes (2018+ filing instructions; confirm against the public LAR
# data dictionary in Phase 3):
#   0 not applicable (not sold)  1 Fannie Mae  2 Ginnie Mae  3 Freddie Mac  4 Farmer Mac
#   5 private securitizer  6 commercial bank / savings bank / savings association
#   71 credit union, mortgage company or finance company  72 life insurance company
#   8 affiliate institution  9 other type of purchaser
holder_segments:
  retained:
    label: Retained (not sold in origination year)
    purchaser_types: [0]
    overlaps: Call Report buckets
  gse:
    label: Sold to Fannie / Freddie
    purchaser_types: [1, 3]
    overlaps: Agency pools (v2)
  ginnie:
    label: Ginnie Mae
    purchaser_types: [2]
    overlaps: Agency pools (v2)
  private_securitization:
    label: Private securitization
    purchaser_types: [5]
    overlaps: Non-agency RMBS (out of scope)
  other:
    label: Sold to another institution / affiliate / other
    # 4 (Farmer Mac) is not in the PLAN.md §7.2 table. It is not an agency MBS pool,
    # so it goes to the unknown-holder segment rather than being dropped.
    purchaser_types: [4, 6, 71, 72, 8, 9]
    overlaps: Unknown holder
# Any purchaser_type not listed above maps here, and the QA report counts those rows.
unmapped_segment: unmapped

# HMDA panel -> lender_type (PLAN.md §5.3). First matching rule wins; raw codes are kept
# alongside the mapped value in dim_hmda_lender. Conditions: in_call_reports (the RSSD files
# a Call Report that year; a rule on it never matches when Call Reports for the year aren't
# loaded), agency_code, other_lender_code, name_pattern (case-insensitive).
#
# VERIFY result (docs/verification.md, item 7), from the 2021 panel. The panel codes alone
# misclassify:
#   - other_lender_code 3 is labelled "independent mortgage banking subsidiary", but 867 of
#     its 938 lenders report to HUD (agency 7) and are independent mortgage companies.
#   - other_lender_code -1 (blank) mixes banks, credit unions and mortgage companies.
#   - Large credit unions report to the CFPB (agency 9), not NCUA (agency 5): Navy Federal,
#     PenFed, Boeing Employees, Star One.
# So the Call Report link comes first, and the codes decide the rest.
#   agency_code: 1 OCC, 2 FRS, 3 FDIC, 5 NCUA, 7 HUD, 9 CFPB
#   other_lender_code: 0 depository, 1 MBS of state member bank, 2 MBS of bank holding
#   company, 3 independent mortgage banking subsidiary, 5 affiliate of a depository, -1 blank
lender_type_rules:
  - lender_type: bank                 # banks and savings associations file Call Reports
    in_call_reports: true
  - lender_type: credit_union
    agency_code: [5]
  - lender_type: credit_union         # large credit unions supervised by the CFPB
    name_pattern: "credit union"
  - lender_type: credit_union         # a CFPB-supervised depository with no Call Report is
    agency_code: [9]                  # a credit union, e.g. "STATE EMPLOYEES'", "THE GOLDEN 1"
    other_lender_code: [0]
    in_call_reports: false
  - lender_type: bank_affiliate       # mortgage subsidiaries and affiliates of depositories
    other_lender_code: [1, 2, 5]
  - lender_type: independent_mortgage_company
    other_lender_code: [3]
  - lender_type: independent_mortgage_company
    agency_code: [7]
  - lender_type: independent_mortgage_company   # CFPB-supervised non-depositories
    agency_code: [9]
    other_lender_code: [-1]
    in_call_reports: false
  - lender_type: bank                 # bank regulators, but no Call Report match that year
    agency_code: [1, 2, 3]
  - lender_type: unknown
