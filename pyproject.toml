[project]
name = "armreset"
dynamic = ["version"]
description = "US residential mortgage rate-reset exposure from FFIEC Call Reports and HMDA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.10",
    "pyarrow>=17",
    "httpx>=0.27",
    "tenacity>=9.0",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings[yaml]>=2.3",
    "pyyaml>=6.0",
    "streamlit>=1.38",
    "plotly>=5.24",
    # Pre-release that scrapes the CDR ASP.NET bulk-download page: keep the exact pin.
    # The CDR fetcher falls back to manually placed zips when it fails.
    "ffiec-data-collector==2.0.0rc2",
]

[project.optional-dependencies]
llm = ["openai>=1.40"]  # natural-language-to-SQL in the SQL console (off unless llm.base_url is set)

[project.scripts]
armtool = "armreset.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/armreset/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/armreset"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["*.md"]  # PLAN.md is kept verbatim; ruff would reformat its code blocks

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
